name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      # ponytail: tsc is not gated yet, the repo has ~20 older type errors (mostly services/examples).
      # Add `npx tsc --noEmit` here once they're fixed.
      - run: npm test -- --ci
